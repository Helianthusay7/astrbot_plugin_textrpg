name: astrbot_plugin_textrpg
display_name: 修仙文字 RPG
short_desc: 群聊指令式修仙 RPG：八境九转、渡天劫飞升、秘境爬塔、十品装备、天道令兑换帝兵。
author: 老板
version: 3.5.0
desc: 群聊指令式修仙 RPG。八境九转（72 转）境界体系、渡天劫飞升转生、每日秘境爬塔、五行大道秘典（火/水/金/土/风）、挂机探索掉落残页。十品装备体系（一品~九品 + 帝兵），135 件装备按「品阶 × 三套系 × 五部位」组织，分破锋/通玄/镇岳三套机制（概率无视防御、术法增伤、减伤反伤）；七品以上下架坊市，靠秘境里程碑产出。帝兵走独立【特殊】栏、无阶位限制、带成长被动，以 100 枚天道令兑换（每日 /签到 +1、秘境首通 +1）。VIP 赞助者系统：普通 10 元/月每日签到额外 +1 枚、至尊 30 元/月额外 +3 枚，只能由天道发放，不碰战斗数值。面板走「基础 × 乘区 × (1 + 装备%) × (1 + 特殊%)」，加新系统只需插乘区。装备有品阶转数门槛。内置 /菜单 与 /简介 引导。妖兽 72 只覆盖全部转数，回合上限 30。按群独立存档。
repo: https://github.com/Helianthusay7/astrbot_plugin_textrpg
astrbot_version: ">=4.16,<5"
support_platforms:
  - aiocqhttp
